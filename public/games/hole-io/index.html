      var models = window.UPLOADED_3D_MODELS || [];

      var lookup = {};

      models.forEach(function(item) {
        lookup['assets/' + item.name] = item.dataUrl;
        lookup[item.name] = item.dataUrl;
        lookup['./' + 'assets/' + item.name] = item.dataUrl;

      });

      function resolveAsset(url) {
        if (typeof url !== 'string') return null;
        var clean = url.replace(/^\.?\//, '');
        return lookup[clean] || lookup[url] || null;
      }

      var _origFetch = window.fetch;
      window.fetch = function(url, opts) {
        var resolved = resolveAsset(typeof url === 'string' ? url : (url && url.url) || '');
        if (resolved) return _origFetch.call(window, resolved, opts);
        return _origFetch.apply(this, arguments);
      };

      var _origXHROpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url) {
        var resolved = resolveAsset(url);
        if (resolved) arguments[1] = resolved;
        return _origXHROpen.apply(this, arguments);
      };

        });
