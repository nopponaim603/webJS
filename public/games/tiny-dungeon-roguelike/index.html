<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tiny Dungeon Survivor - Action Roguelike</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #070913;
            color: #f8fafc;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 242, 254, 0.15);
            border-radius: 12px;
        }

        /* Virtual Touch Joystick Overlay for Mobile */
        .touch-joystick-container {
            position: absolute;
            bottom: 24px;
            left: 24px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            touch-action: none;
            display: none;
            z-index: 99;
        }

        .touch-joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.5);
            pointer-events: none;
            transition: transform 0.05s ease-out;
        }

        /* Responsive UI Gating */
        @media (pointer: coarse), (max-width: 768px) {
            .touch-joystick-container {
                display: block;
            }
        }

        /* Mobile portrait: pin game to the top instead of centering vertically,
           since Phaser's FIT scaling leaves large empty gaps above/below on tall screens */
        @media (max-width: 768px) and (orientation: portrait) {
            html, body {
                align-items: flex-start;
            }

            #game-wrapper {
                align-items: flex-start;
                padding-top: env(safe-area-inset-top, 0px);
            }

            #game-container {
                align-items: flex-start;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container"></div>
        <div id="virtual-joystick" class="touch-joystick-container">
            <div id="virtual-joystick-knob" class="touch-joystick-knob"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
