<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dice Quest - เกมกระดานทอยลูกเต๋า</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- HUD -->
        <div id="hud">
            <div class="hud-title">🎲 Dice Quest</div>
            <div id="players-row"></div>
        </div>

        <!-- Board -->
        <div id="board">
            <div id="board-center" class="board-center">
                <div class="center-title">🎲 Dice Quest</div>
                <div id="dice-area">
                    <div id="dice" class="dice hidden">
                        <img id="die1" alt="die 1">
                        <img id="die2" alt="die 2">
                    </div>
                </div>
                <button id="btn-roll" class="btn btn-primary">🎲 ทอยลูกเต๋า</button>
                <div id="status" class="status">กดปุ่มเพื่อเริ่มเกม</div>
            </div>
        </div>

        <!-- Bottom panel -->
        <div id="panel">
            <div id="log"></div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
        <div class="modal-card">
            <h2 id="modal-title"></h2>
            <p id="modal-body"></p>
            <div id="modal-actions"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
