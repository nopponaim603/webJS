<!doctype html>
<html lang="en" style="height: 100%">
<head>
  <meta charset="utf-8">
  <meta name="darkreader-lock">
  <title>WarFront.io — Real-Time Macro Strategy</title>
  <meta name="description" content="Battle players to conquer the world!">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/game.js?v=2"></script>
</head>
<body style="margin: 0; height: 100%; overflow: hidden; touch-action: none">
  <!-- Game HUD Overlay -->
  <div id="GameHud" style="display: none">
    <div id="GameHudContainer" class="layout-window background-vignette">
      <div class="anchor-top-right flex-row grid-gap-m ui-passive p-1_2">
        <span id="gameClock" class="hud-clock">00:00:00</span>
        <button id="openSettings" class="btn btn-circle btn-primary icon-m icon-settings"></button>
        <button id="exitGame" class="btn btn-circle btn-danger icon-m icon-quit"></button>
      </div>
      <div id="selectorContainer" class="anchor-bottom-center ui-passive selector-container">
        <div class="selector-stats-container">
          <span id="selectorDensityNumber" class="selector-stat-success selector-stat">0</span>
          <span id="selectorTroopCount" class="selector-stat">0</span>
        </div>
        <label id="sliderAttackStrength" class="selector-slider">
          <span id="sliderAttackNumber" class="selector-number selector-number-reversed">50.0%</span>
          <input id="sliderAttackHidden" type="range" min="0" max="100" step="any">
        </label>
      </div>
    </div>
  </div>

  <!-- Main Menu Overlay -->
  <div id="MainMenu" style="display: none">
    <div class="theme-background"></div>
    <div id="MainMenuContainer" class="layout-window flex-centered background-vignette background-blur">
      <div class="anchor-middle-center flex-centered w-100" style="max-width: 392px;">
        <div class="theme-logo" style="width: 200px; height: 200px;"></div>
        <div class="panel w-100">
          <div class="panel-body">
            <div class="grid grid-1col">
              <input class="form-control text-lg" id="playerNameInput" placeholder="Player Name" value="UnknownPlayer">
              <span class="form-label form-label-danger" style="display: none;" id="playerNameInputValidation"></span>
              <button class="btn btn-primary btn-featured btn-block" id="btnStartSingleplayer">Singleplayer</button>
            </div>
          </div>
        </div>
        <div class="pt-1" style="display: flex; align-items: center; align-content: center; justify-items: center; justify-content: center;">
          <a href="https://discord.gg/Zv8p8tXaDA" target="_blank" title="Join us on Discord" class="icon-fixed icon-discord mr-1_2"></a>
          <a href="https://github.com/WarFrontIO" target="_blank" title="See the code on GitHub" class="icon-fixed icon-github"></a>
        </div>
      </div>
    </div>
    <div class="footer ui-passive">
      <a id="linkImprint" href="javascript:void(0);" class="ui-clickable">Site Notice</a> |
      <a id="linkPrivacy" href="javascript:void(0);">Privacy</a>
    </div>
  </div>
</body>
</html>
