<!doctype html>
<html lang="zh-CN">
  <head><style data-aigameshare-play-guard>
html,
body {
  min-height: 100%;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}

html,
body,
body * {
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none !important;
  -webkit-user-drag: none !important;
  -webkit-user-select: none !important;
  user-select: none !important;
}

input,
textarea,
[contenteditable="true"] {
  -webkit-touch-callout: default !important;
  -webkit-user-select: text !important;
  user-select: text !important;
}
</style>
<script data-aigameshare-play-guard>
(() => {
  const createMemoryStorage = () => {
    const store = new Map();

    return {
      get length() {
        return store.size;
      },
      clear() {
        store.clear();
      },
      getItem(key) {
        const normalizedKey = String(key);
        return store.has(normalizedKey) ? store.get(normalizedKey) : null;
      },
      key(index) {
        return Array.from(store.keys())[Number(index)] ?? null;
      },
      removeItem(key) {
        store.delete(String(key));
      },
      setItem(key, value) {
        store.set(String(key), String(value));
      },
    };
  };
  const ensureSandboxStorage = (name) => {
    try {
      window[name].getItem("__aigameshare_probe__");
    } catch {
      try {
        Object.defineProperty(window, name, {
          value: createMemoryStorage(),
          configurable: true,
        });
      } catch {
        // Some browsers may still refuse overrides. Game code should handle that case.
      }
    }
  };
  const isEditable = (target) =>
    target instanceof Element &&
    Boolean(target.closest('input, textarea, [contenteditable="true"]'));
  const blockBrowserMenu = (event) => {
    if (!isEditable(event.target)) {
      event.preventDefault();
    }
  };

  // Native modals never render here (the sandbox has no allow-modals) and
  // confirm() silently returns false, which turns "are you sure?" gates into
  // dead buttons. Auto-confirm instead and point the developer at the fix.
  const shimModal = (name, result, note) => {
    try {
      Object.defineProperty(window, name, {
        value: (message) => {
          console.warn(
            "[AIGameShare] window." + name + "() is blocked by the iframe sandbox — " + note +
            " Build an in-game dialog instead.",
            message ?? "",
          );
          return result;
        },
        configurable: true,
        writable: true,
      });
    } catch {
      // Some browsers may refuse the override; native (blocked) behavior remains.
    }
  };
  shimModal("confirm", true, "auto-confirming (returns true).");
  shimModal("alert", undefined, "the message is not shown.");
  shimModal("prompt", null, "returning null.");

  ensureSandboxStorage("localStorage");
  ensureSandboxStorage("sessionStorage");
  document.addEventListener("contextmenu", blockBrowserMenu, { capture: true });
  document.addEventListener("selectstart", blockBrowserMenu, { capture: true });
  document.addEventListener("dragstart", blockBrowserMenu, { capture: true });
  document.addEventListener("gesturestart", blockBrowserMenu, { capture: true });
})();
</script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e9e2d0" />
    <meta
      name="description"
      content="Ink Warden 墨守 — a calligraphy defense game painted in living ink. Your finger is the brush: any stroke is a blade, true glyphs become spells, and beautiful writing makes them stronger."
    />
    <title>Ink Warden 墨守</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="shell" aria-label="Ink Warden">
      <canvas id="paperCanvas" aria-hidden="true"></canvas>
      <canvas id="bgCanvas" aria-hidden="true"></canvas>
      <canvas id="fluidCanvas" aria-hidden="true"></canvas>
      <canvas id="gameCanvas" aria-label="Ink Warden battlefield"></canvas>
      <div id="grain" aria-hidden="true"></div>

      <header id="hud" aria-label="Status">
        <div id="titleBlock" aria-hidden="true">
          <h1 id="titleText">墨守</h1>
          <span id="chapterLabel"></span>
        </div>

        <div id="scoreBlock" aria-live="off">
          <span id="scoreLabel">功德</span>
          <strong id="scoreValue">0</strong>
        </div>

        <div id="hudButtons">
          <button id="langBtn" class="seal-btn" type="button" aria-label="Switch language">EN</button>
          <button id="pauseBtn" class="seal-btn" type="button" aria-label="Pause">停</button>
          <button id="soundBtn" class="seal-btn" type="button" aria-label="Toggle sound">音</button>
        </div>
      </header>

      <div id="inkwell" aria-hidden="true">
        <div id="inkFrame"><div id="inkFill"></div></div>
        <span id="inkGlyph">墨</span>
      </div>

      <div id="comboTag" aria-hidden="true">
        <em id="comboWord">連綿</em>
        <strong id="comboValue">×2</strong>
      </div>

      <div id="banner" aria-live="polite"></div>

      <div id="overlay" hidden>
        <section id="choicePanel" class="panel" hidden>
          <h2 id="choiceTitle">擇 帖</h2>
          <p id="choiceSub"></p>
          <div id="choiceCards"></div>
        </section>

        <section id="pausePanel" class="panel" hidden>
          <h2 id="pauseTitle">小 憩</h2>
          <p id="pauseHint"></p>
          <div id="spellSheet"></div>
          <div class="panel-actions">
            <button id="resumeBtn" class="brush-btn" type="button"></button>
            <button id="restartBtn" class="brush-btn ghost" type="button"></button>
          </div>
        </section>

        <section id="overPanel" class="panel" hidden>
          <h2 id="overTitle">遺 墨</h2>
          <canvas id="relicCanvas" width="10" height="10"></canvas>
          <div id="overStats"></div>
          <div class="panel-actions">
            <button id="againBtn" class="brush-btn" type="button"></button>
            <button id="saveBtn" class="brush-btn ghost" type="button"></button>
          </div>
          <p id="overNote"></p>
        </section>
      </div>
    </main>

    <script src="./fluid.js"></script>
    <script src="./game.js"></script>
  
</body>
</html>
