<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Babylon.js - Memory Card Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        #info { color: #fff; margin-bottom: 10px; font-size: 16px; }
        #info span { color: #0f0; }
        canvas { border: 2px solid #0f0; outline: 3px solid #0a0; cursor: pointer; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <div id="info">Moves: <span id="moves">0</span> | Matches: <span id="matches">0</span>/6</div>
    <canvas id="rc" width="800" height="500"></canvas>
    <script>
    const CARDS = ['🍎','🍊','🍋','🍇','🍉','🍓'];
    const COLS = 4, ROWS = 3;
    const CW = 100, CH = 130, GAP = 10;
    
    const c = document.getElementById('rc');
    const e = new BABYLON.Engine(c, true);
    scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.04, 1);

    // Camera straight-on, locked angle
    const cam = new BABYLON.ArcRotateCamera("cam", 
        0, Math.PI / 2.01, 250, 
        BABYLON.Vector3.Zero(), s);
    cam.attachControl(c, true);
    cam.upperBetaLimit = Math.PI / 2.02;
    cam.lowerBetaLimit = Math.PI / 2.02;
    cam.minZoomDistance = 200;
    cam.maxZoomDistance = 300;

    const hemi = new BABYLON.HemisphericLight("h", new BABYLON.Vector3(0, 1, 0), s);
    hemi.intensity = 1.0;
    
    const cards = [];
    const cardData = [];
    for (let i = 0; i < COLS * ROWS; i++) {
        const col = i % COLS;
        const row = Math.floor(i / COLS);
        const x = -((COLS * (CW + GAP)) - GAP) / 2 + col * (CW + GAP);
        const y = ((ROWS * (CH + GAP)) - GAP) / 2 - row * (CH + GAP);
        cards.push({ id: i, emoji: '', x: x, y: y, flipped: false, matched: false, mesh: null, mat: null });
        cardData.push(i);
    }
    
    const emojis = [...CARDS, ...CARDS];
    for (let i = emojis.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [emojis[i], emojis[j]] = [emojis[j], emojis[i]];
    }
    cards.forEach((cd, i) => { cd.emoji = emojis[i]; });
    
    cards.forEach((cd, i) => {
        const b = BABYLON.MeshBuilder.CreateBox("card_" + i, {width: CW, height: CH, depth: 0.5}, s);
        b.position = new BABYLON.Vector3(cd.x, cd.y, 0);
        
        const m = new BABYLON.StandardMaterial("cardMat_" + i, s);
        m.diffuseColor = new BABYLON.Color3(0.1, 0.2, 0.4);
        m.emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.2);
        m.backFaceCulling = false;
        b.material = m;
        
        cd.mesh = b;
        cd.mat = m;
    });
    
    let selected = [];
    let moves = 0;
    let matches = 0;
    let canClick = true;
    
    s.onPointerObservable.add(function(info) {
        if (!canClick || info.type !== BABYLON.PointerEventTypes.POINTERPICK) return;
        const p = info.pickedPoint;
        if (!p) return;
        
        const idx = cards.findIndex(c =>
            Math.abs(c.x - p.x) < CW * 0.4 && Math.abs(c.y - p.y) < CH * 0.4 &&
            !c.flipped && !c.matched);
        
        if (idx >= 0 && selected.length < 2) {
            const cd = cards[idx];
            cd.flipped = true;
            cd.mat.emissiveColor = new BABYLON.Color3(0.4, 0.4, 0.5);
            selected.push(cd);
            
            if (selected.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                canClick = false;
                const [c1, c2] = selected;
                
                setTimeout(() => {
                    if (c1.emoji === c2.emoji) {
                        matches++;
                        document.getElementById('matches').textContent = matches;
                        c1.matched = true;
                        c2.matched = true;
                        c1.mat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.2);
                        c2.mat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.2);
                        selected = [];
                        canClick = true;
                        if (matches === CARDS.length) alert('Win! Moves: ' + moves);
                    } else {
                        c1.flipped = false;
                        c2.flipped = false;
                        c1.mat.emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.2);
                        c2.mat.emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.2);
                        selected = [];
                        canClick = true;
                    }
                }, 800);
            }
        }
    });
    
    e.runRenderLoop(() => s.render());
    window.addEventListener('resize', () => e.resize());
    </script>
</body>
</html>
