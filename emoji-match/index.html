<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Match - Brain Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="game-header">
        <div class="stat-item">
            <span class="stat-label">เวลา</span>
            <span class="stat-value" id="timer">0:00</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">การจับคู่</span>
            <span class="stat-value" id="moves">0</span>
        </div>
    </header>

    <div class="game-grid" id="gameGrid">
        <!-- Cards will be generated by JS -->
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <h2>สุดยอดเลย! 🎉</h2>
            <p>คุณรวบรวมได้ครบทั้งหมดแล้ว</p>
            <div style="display: flex; justify-content: space-around; margin-bottom: 30px;">
                <div class="stat-item">
                    <span class="stat-label">จำนวนครั้ง</span>
                    <span class="stat-value" id="finalMoves">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">เวลาที่ใช้</span>
                    <span class="stat-value" id="finalTime">0:00</span>
                </div>
            </div>
            <button class="btn" onclick="initGame()">เล่นอีกครั้ง</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
