<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Cubes - Physics Drop Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>

<body>
    <div id="game-container"></div>
    <div id="ui-layer">
        <div class="header">
            <div class="score-container">
                <div class="label">SCORE</div>
                <div id="score" class="value">0</div>
            </div>
            <div class="highscore-container">
                <div class="label">BEST</div>
                <div id="highscore" class="value">0</div>
            </div>
            <button id="theme-btn" class="icon-btn" title="เปลี่ยนธีม">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2ZM12,20V4A8,8 0 0,1 20,12A8,8 0 0,1 12,20Z" />
                </svg>
            </button>
            <button id="exit-fullscreen-btn" class="icon-btn hidden" title="ออกจากเต็มจอ">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 14h6m0 0v6m0-6L3 21M20 10h-6m0 0V4m0 6l7-7"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="game-over" class="overlay hidden">
        <div class="modal">
            <h1>Game Over!</h1>
            <p>Your Score: <span id="final-score">0</span></p>
            <button id="restart-btn">Try Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
